<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Orders — PIECES OF PEACE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23D8A821' width='16' height='16'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="wrap headerbar">
    <a href="index.html" class="logo">PIECES OF PEACE<sup>&trade;</sup></a>
    <nav><a href="index.html#shop">Shop</a></nav>
  </div>
</header>
<main class="section page-main">
  <div class="wrap">
    <h1>Orders</h1>
    <p class="lede">Paid orders, the Temu link for each piece, and a place to mark them fulfilled. Shoppers never see this page's data.</p>
    <form id="loginForm" class="admin-login">
      <label for="password">Admin password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required style="display:block;width:min(360px,100%);margin:8px 0 14px;padding:12px;border:2px solid var(--ink);font:inherit">
      <button class="btn-primary" type="submit" id="loginFormBtn">Sign in</button>
      <div class="checkout-error" id="loginError" role="alert"></div>
    </form>
    <div id="ordersPanel" hidden>
      <div class="admin-toolbar">
        <label>Show
          <select id="statusFilter">
            <option value="paid" selected>Paid</option>
            <option value="pending">Pending</option>
            <option value="cancelled">Cancelled</option>
            <option value="all">All</option>
          </select>
        </label>
        <button type="button" id="csvBtn">Download CSV</button>
        <button type="button" id="logoutBtn">Sign out</button>
      </div>
      <div id="orderList"></div>
    </div>
  </div>
</main>
<script src="js/admin.js"></script>
</body>
</html>
